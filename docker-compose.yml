version: '3.8'

services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    container_name: budget-rag-db
    ports:
      - "6153:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: budget_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
