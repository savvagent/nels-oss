name: CLA

# Checks that every contributor to a pull request has signed CLA.md. A
# contributor signs by commenting the sign phrase on their pull request; the
# action records the signature in signatures/version1/cla.json on the
# unprotected `cla-signatures` branch, keeping main's history clean.
#
# pull_request_target is safe here: this job never checks out or runs code
# from the pull request, it only reads its commit authors and comments.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/savvagent/nels-oss/blob/main/CLA.md
          branch: cla-signatures
          allowlist: robhicks,dependabot[bot],release-please[bot],github-actions[bot]
